name: Windows portable build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Core regression tests
        run: npm test
      - name: Build standalone executable
        shell: pwsh
        run: ./tools/build-windows.ps1
      - name: Verify standalone executable
        shell: pwsh
        run: ./tools/test-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: axis09-windows-portable
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/launcher-test-results.json
          if-no-files-found: error
          retention-days: 30

